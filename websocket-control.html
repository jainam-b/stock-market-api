<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebSocket Control</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #f5f7fa;
            padding: 20px;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            padding: 30px;
        }
        h1 {
            font-size: 24px;
            margin-bottom: 20px;
            color: #2c3e50;
        }
        .status-bar {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 14px;
        }
        .status-bar.connected { background: #d4edda; color: #155724; }
        .status-bar.disconnected { background: #f8d7da; color: #721c24; }
        .status-bar.loading { background: #fff3cd; color: #856404; }
        .dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            animation: pulse 2s infinite;
        }
        .dot.green { background: #28a745; }
        .dot.red { background: #dc3545; }
        .dot.yellow { background: #ffc107; }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        .controls {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        button {
            padding: 12px 24px;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
        }
        button:hover { transform: translateY(-1px); }
        button:active { transform: translateY(0); }
        .btn-start { background: #28a745; color: white; }
        .btn-start:hover { background: #218838; }
        .btn-status { background: #007bff; color: white; }
        .btn-status:hover { background: #0056b3; }
        .btn-subscribe { background: #17a2b8; color: white; }
        .btn-subscribe:hover { background: #138496; }
        .section {
            margin-bottom: 25px;
            padding: 20px;
            background: #f8f9fa;
            border-radius: 8px;
        }
        .section h2 {
            font-size: 16px;
            margin-bottom: 15px;
            color: #495057;
        }
        .data-display {
            background: #1e1e1e;
            color: #d4d4d4;
            padding: 15px;
            border-radius: 6px;
            font-family: 'Courier New', monospace;
            font-size: 12px;
            max-height: 400px;
            overflow-y: auto;
            white-space: pre-wrap;
            word-wrap: break-word;
        }
        .input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 10px;
        }
        input {
            flex: 1;
            padding: 10px;
            border: 1px solid #ced4da;
            border-radius: 6px;
            font-size: 14px;
        }
        .message {
            padding: 10px;
            border-radius: 6px;
            margin-bottom: 10px;
            font-size: 13px;
        }
        .message.success { background: #d4edda; color: #155724; }
        .message.error { background: #f8d7da; color: #721c24; }
        .message.info { background: #d1ecf1; color: #0c5460; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔌 WebSocket Control Panel</h1>
        
        <div id="statusBar" class="status-bar disconnected">
            <div class="dot red"></div>
            <span>Disconnected</span>
        </div>

        <div class="section">
            <h2>Connection</h2>
            <div class="controls">
                <button class="btn-start" onclick="startWebSocket()">Start WebSocket</button>
                <button class="btn-status" onclick="checkStatus()">Check Status</button>
            </div>
        </div>

        <div class="section">
            <h2>Subscribe to Options</h2>
            <div class="input-group">
                <input type="text" id="instrumentKeys" placeholder="NSE_FO|50904, NSE_FO|50905" 
                       value="NSE_FO|50904, NSE_FO|50905">
                <button class="btn-subscribe" onclick="subscribeOptions()">Subscribe</button>
            </div>
        </div>

        <div class="section">
            <h2>Messages</h2>
            <div id="messages"></div>
        </div>

        <div class="section">
            <h2>Live Data</h2>
            <div id="liveData" class="data-display">Waiting for data...</div>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const API_URL = 'http://localhost:3000';
        let socket = null;

        // Initialize Socket.IO connection
        function initSocket() {
            if (socket) return;
            
            socket = io(API_URL);
            
            socket.on('connect', () => {
                updateStatus('connected', 'Connected to server');
                addMessage('Socket.IO connected', 'success');
            });
            
            socket.on('disconnect', () => {
                updateStatus('disconnected', 'Disconnected from server');
                addMessage('Socket.IO disconnected', 'error');
            });
            
            socket.on('marketData', (data) => {
                displayData('Market Data', data);
            });
            
            socket.on('fullOptionData', (data) => {
                displayData('Full Option Data', data);
            });
            
            socket.on('optionGreeks', (data) => {
                displayData('Option Greeks', data);
            });
            
            socket.on('ltp', (data) => {
                displayData('LTP Update', data);
            });
            
            socket.on('error', (error) => {
                addMessage(`Error: ${error.message}`, 'error');
            });
        }

        async function startWebSocket() {
            try {
                addMessage('Starting WebSocket...', 'info');
                const response = await fetch(`${API_URL}/start`);
                const result = await response.json();
                
                if (result.success) {
                    addMessage(result.message, 'success');
                    updateStatus('connected', 'WebSocket connected');
                    initSocket();
                } else {
                    addMessage(`Failed: ${result.error}`, 'error');
                }
            } catch (error) {
                addMessage(`Error: ${error.message}`, 'error');
            }
        }

        async function checkStatus() {
            try {
                const response = await fetch(`${API_URL}/status`);
                const result = await response.json();
                
                const status = result.connected ? 'connected' : 'disconnected';
                const message = result.connected ? 'WebSocket is connected' : 'WebSocket is disconnected';
                
                updateStatus(status, message);
                addMessage(JSON.stringify(result, null, 2), 'info');
            } catch (error) {
                addMessage(`Error: ${error.message}`, 'error');
            }
        }

        async function subscribeOptions() {
            try {
                const input = document.getElementById('instrumentKeys').value;
                const instruments = input.split(',').map(s => s.trim()).filter(s => s);
                
                if (instruments.length === 0) {
                    addMessage('Please enter instrument keys', 'error');
                    return;
                }
                
                addMessage(`Subscribing to ${instruments.length} instruments...`, 'info');
                
                const response = await fetch(`${API_URL}/options/subscribe`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ instrumentKeys: instruments, mode: 'full' })
                });
                
                const result = await response.json();
                
                if (result.success) {
                    addMessage(`Subscribed successfully!`, 'success');
                } else {
                    addMessage(`Failed: ${result.error}`, 'error');
                }
            } catch (error) {
                addMessage(`Error: ${error.message}`, 'error');
            }
        }

        function updateStatus(status, message) {
            const statusBar = document.getElementById('statusBar');
            statusBar.className = `status-bar ${status}`;
            
            const dotClass = status === 'connected' ? 'green' : status === 'loading' ? 'yellow' : 'red';
            statusBar.innerHTML = `<div class="dot ${dotClass}"></div><span>${message}</span>`;
        }

        function addMessage(text, type = 'info') {
            const messagesDiv = document.getElementById('messages');
            const message = document.createElement('div');
            message.className = `message ${type}`;
            message.textContent = `[${new Date().toLocaleTimeString()}] ${text}`;
            messagesDiv.insertBefore(message, messagesDiv.firstChild);
            
            // Keep only last 10 messages
            while (messagesDiv.children.length > 10) {
                messagesDiv.removeChild(messagesDiv.lastChild);
            }
        }

        function displayData(label, data) {
            const liveDataDiv = document.getElementById('liveData');
            const timestamp = new Date().toLocaleTimeString();
            liveDataDiv.textContent = `[${timestamp}] ${label}:\n${JSON.stringify(data, null, 2)}`;
        }

        // Auto-check status on load
        window.addEventListener('load', () => {
            checkStatus();
        });
    </script>
</body>
</html>
